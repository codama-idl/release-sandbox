name: Main

on:
  push:
    branches: [main, '[0-9]+.x']
  pull_request:
    branches: [main, '[0-9]+.x']

permissions:
  contents: read

env:
  NODE_VERSION: 24
  RELEASE_VERSION: 3.x

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm test

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: [test]
    if: github.event_name == 'push'
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Open Version Packages PR or publish
        uses: changesets/action@v2.1.1
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          version-script: pnpm release:version
          publish-script: pnpm publish-package
          commit-message: '[${{ env.RELEASE_VERSION }}] Release package'
          pr-title: '[${{ env.RELEASE_VERSION }}] Release package'
          create-github-releases: true
