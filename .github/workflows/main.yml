name: Main

on:
  push:
    branches: [main, '[0-9]+.x']
  pull_request:
    branches: [main, '[0-9]+.x']

permissions:
  contents: read

env:
  NODE_VERSION: 24

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm test

  release:
    name: Release
    needs: [test]
    if: github.event_name == 'push'
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    uses: codama-idl/release-tools/.github/workflows/release.yml@main
    with:
      release-version: 3.x
    secrets: inherit
